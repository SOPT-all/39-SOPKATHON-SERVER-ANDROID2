name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Spring Boot
        run: ./gradlew clean bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sopkathon-server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_HOST,DB_NAME,DB_USERNAME,DB_PASSWORD,DOCKERHUB_USERNAME
          script: |
            set -eu

            cd /opt/sopkathon
            umask 077

            python3 -c '
            import os
            from pathlib import Path

            keys = ["DB_HOST", "DB_NAME", "DB_USERNAME", "DB_PASSWORD"]
            values = []
            for key in keys:
                value = os.environ[key]
                if "\n" in value or "\r" in value:
                    raise ValueError("Invalid environment variable")
                values.append(f"{key}={value}\n")

            Path(".env").write_text("".join(values))
            '

            IMAGE="$DOCKERHUB_USERNAME/sopkathon-server:latest"

            docker pull "$IMAGE"
            docker rm -f sopkathon-server || true

            docker run -d \
              --name sopkathon-server \
              --restart unless-stopped \
              --env-file /opt/sopkathon/.env \
              -p 127.0.0.1:8080:8080 \
              "$IMAGE"
